# One-click deploy on Render (https://render.com/deploy). Set the secret env vars in the dashboard.
services:
  - type: web
    name: savesutra
    runtime: docker
    dockerfilePath: ./apps/server/Dockerfile
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: API_TOKEN
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        generateValue: true
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_OWNER_NUMBER
        sync: false
